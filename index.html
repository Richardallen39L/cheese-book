const CFG=window.CHEESE_CFG||{clientId:''};

 let fp=null,dg=null;const wlog=[];const note=(m)=>{wlog.push(new Date().toLocaleTimeString('en-GB')+' '+m);if(wlog.length>14)wlog.shift()};

  const roots=r.files.map(f=>f.id),root=roots[0]||await mk(ROOT,null),m={'':root},all={},nm={};(roots.length?roots:[root]).forEach(i=>{all[i]='';nm[i]=ROOT});

   do{const r=await jq(`${API}/files?q=${enc('('+cond+") and trashed=false and mimeType!='application/vnd.google-apps.folder'")}&fields=nextPageToken,files(id,name,modifiedTime,parents)&pageSize=1000${pt?'&pageToken='+pt:''}`);

   fid={};Object.entries(cur).forEach(([p,x])=>fid[p]=x.id);dg={at:Date.now(),folders:Object.keys(inv).map(i=>(inv[i]||'(root)')+' = "'+m.nm[i]+'" '+i.slice(0,6)+'\u2026'),counts:cnt,files:Object.keys(cur)};return Object.entries(cur).map(([p,x])=>({path:p,modified:x.m}))},

   const r=await api(`${UP}/files?uploadType=multipart&fields=id,modifiedTime`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body}),j=await r.json();fid[p]=j.id;note('created '+p+' ('+t.length+' chars) id '+String(j.id).slice(0,6)+'\u2026 in folder '+String(m[dir]).slice(0,6)+'\u2026');return Date.parse(j.modifiedTime)},
  async del(p){if(!fid[p])return;try{await api(`${API}/files/${fid[p]}`,{method:'DELETE'})}catch(e){if(e.status!==404)throw e}delete fid[p]}}})();
const Drive=CFG.clientId?GoogleDrive:SimDrive;

async function flush(){if(busy)return;busy=true;if(Drive.warm)Drive.warm();try{while(Q.length){setStat('saving');const q=Q[0];if(q.op==='put'){const e=FS[q.p];if(e){const m=await Drive.put(q.p,isJ(q.p)?JSON.stringify(e.v):e.v);if(FS[q.p]===e)e.m=m}}else await Drive.del(q.p);const i=Q.indexOf(q);if(i>=0)Q.splice(i,1);persist()}setStat('synced')}catch(e){setStat(e&&e.code==='auth'?'signin':'offline')}busy=false}

function showDiag(){const d=Drive.diag?Drive.diag():{},g=d.dg,mk=Store.keys('makes/').filter(p=>p.endsWith('.json'));
 const t=['Cheese Book v'+VERSION,'Signed in: '+(Drive===SimDrive?'test mode (no Drive)':d.signed?'yes (token valid for about '+d.mins+' min)':'no / token expired'),'Last Drive refresh: '+(pullAt?new Date(pullAt).toLocaleTimeString('en-GB'):'none yet'),'',
  'Folders the app reads:',...(g?g.folders.map(x=>'  '+x):['  (not read yet)']),'','Files found in Drive per folder: '+(g?JSON.stringify(g.counts):'-'),
  'Make files in Drive:',...(g?g.files.filter(p=>p.startsWith('makes/')).map(x=>'  '+x):[]),'','Makes loaded in the app: '+mk.length,...mk.map(x=>'  '+x),'','Waiting to save: '+Q.length,'','Recent uploads this session:',...(d.wlog&&d.wlog.length?d.wlog.map(x=>'  '+x):['  none since the page opened']),
  'Files that could not be read: '+(pullErr.length?'':'none'),...pullErr.map(x=>'  '+x)].join('\n');
 const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(16,36,61,.55);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px';
 o.innerHTML='<div style="background:#fff;max-width:640px;width:100%;max-height:90vh;overflow:auto;border-radius:8px;padding:14px"><h3 style="margin:0 0 8px">Drive status</h3><pre style="white-space:pre-wrap;font:12px/1.4 ui-monospace,Consolas,monospace;margin:0 0 10px"></pre><button class="b" id="dgc">Close</button> <button class="b o" id="dgy">Copy</button> <button class="b o" id="dgr">Refresh now</button></div>';

 if(Drive.audit)Drive.audit().then(({out,all})=>{const nm=id=>id in all?(all[id]||'(root)'):'OTHER '+String(id).slice(0,6)+'\u2026',ln=[];for(const tr of['false','true']){const L=out[tr].filter(f=>f.mimeType!=='application/vnd.google-apps.folder'&&!/^recipes$/.test((f.parents||[]).map(nm)[0]||''));ln.push('','Every non-recipe file the app can see'+(tr==='true'?' IN THE DRIVE BIN':'')+': '+L.length,...L.map(f=>'  '+f.name+'  ['+f.mimeType+']  folder: '+((f.parents||[]).map(nm).join(',')||'none')))}full=t+'\n'+ln.join('\n');pre.textContent=full}).catch(e=>{pre.textContent=t+'\n\n(audit failed: '+(e&&e.message||e)+')'});o.querySelector('#dgc').onclick=()=>o.remove();o.querySelector('#dgy').onclick=()=>{try{navigator.clipboard.writeText(pre.textContent)}catch(e){}};o.querySelector('#dgr').onclick=async()=>{o.remove();if(await pull()){rebuild();render()}showDiag()}}
const $=s=>document.querySelector(s),names=[];let cur=localStorage.getItem('cb:cur')||'';
const pad=n=>String(n).padStart(2,'0'),tf=t=>{const d=new Date(t);return d.toLocaleDateString('en-GB',{weekday:'short'})+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const df=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

const nowIso=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());d.setSeconds(0,0);return d.toISOString().slice(0,16)};
function frac(q){if(q>=1||q<=0)return String(+q.toFixed(2));for(const d of[2,3,4,8,16,32,64,128])if(Math.abs(q*d-Math.round(q*d))<1e-6)return Math.round(q*d)+'/'+d;return String(+q.toFixed(3))}
const ingl=(c,m)=>c.ing.map(([q,u,t])=>(q==null?'':fmtq(q*m/c.base,u)+' ')+t);

const cl=o=>JSON.parse(JSON.stringify(o));
const P={},ATT={H:'Hands-on',C:'Check',F:'Free'},esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

 const rows=c.steps.map((x,i)=>{const a=t;t+=mm(x)*6e4;return{...x,att:x.a,m:mm(x),i,a,b:t,n:i+1-(c.steps[0]&&c.steps[0].mise?1:0),sub:x.mise?ingl(c,s.milk):x.sub}});const act=Math.min(c.act||rows.length,rows.length);
 let r=t;const age=c.age.map(g=>{r+=g.d*864e5;return{...g,until:r}});return{rows,act,start,actEnd:act?rows[act-1].b:start,end:t,age,ready:r}}

 for(let v=20;v<mx;v+=(mx>60?20:10))g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#dde7f4"/><text x="${L-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#567">${v}°</text>`;

 <div id="bn" class="box" style="display:${r.bn?'block':'none'};background:#fff3cd;border-color:#e0a800;font-weight:600">${esc(r.bn||'')}</div>
 <div class="sum"><div>Started<b>${tf(r.start)}</b></div><div>Active work forecast to end<b>${ck(act.b)}</b></div><div>Make forecast to end<b>${ck(R[R.length-1].b)}</b></div><div>Steps done<b>${r.st.filter(s=>s.done).length} / ${R.length}</b></div></div>${card}
 <table><tr><th></th><th>Step</th><th>Planned</th><th>Actual / forecast</th><th>Temp</th><th>pH</th><th>Reading</th></tr>${R.map(y=>{const s=r.st[y.i],dn=!!s.done;return`<tr style="${y.i===k?'background:var(--pale)':''}"><td class="n">${dn?'&#10003;':y.n}</td><td>${esc(y.t)}${subs(y)}</td><td>${ck(y.p0)}</td><td>${dn?'<b>'+ck(s.done)+'</b>':'~'+ck(y.b)}</td><td>${y.temp!=null?y.temp+'°C':''}</td><td>${esc(y.ph||'')}</td><td>${[s.temp&&s.temp+'°C',s.ph&&'pH '+s.ph,...Object.entries(s.meas).map(([a,b])=>b&&a+' '+b)].filter(Boolean).join(', ')}</td></tr>`}).join('')}</table>
 ${c.age.length?`<div class="box"><h3>After the make</h3>${c.age.map(g=>esc(g.t)+(g.d?' ('+g.d+' days)':'')).join('<br>')}</div>`:''}`}
function reportHtml(h){const d=new Date(h.start),nm=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+h.cheese;let body;let p=h.start;const rows=h.rec.steps.map((x,i)=>{const s=h.st[i],p0=p;p+=(x.m||0)*6e4;const ms=Object.entries(s.meas||{}).map(([a,b])=>a+': '+b).join(', ');return`<tr><td>${i+1-(h.rec.steps[0]&&h.rec.steps[0].mise?1:0)}</td><td>${esc(x.t)}</td><td>${tf(p0).split(' ')[1]}</td><td>${s.done?tf(s.done).split(' ')[1]:''}</td><td>${x.temp??''}</td><td>${esc(s.temp)}</td><td>${esc(x.ph||'')}</td><td>${esc(s.ph)}</td><td>${esc(ms)}</td></tr>`}).join('');
 body=`<!doctype html><meta charset="utf-8"><title>${esc(nm)}</title><style>body{font:14px system-ui;margin:24px;color:#10243d}table{border-collapse:collapse}td,th{border:1px solid #bcd;padding:4px 7px;text-align:left}</style><h1>${esc(h.cheese)}, ${df(h.start)}</h1><p>${h.milk} litres of milk. Started ${tf(h.start)}. Result: ${esc(h.score)}/10</p><table><tr><th></th><th>Step</th><th>Planned</th><th>Actual</th><th>Temp goal</th><th>Temp</th><th>pH goal</th><th>pH</th><th>Measured</th></tr>${rows}</table><h3>Observations</h3><p>${esc(h.obs)}</p><h3>Mistakes</h3><p>${esc(h.mist)}</p><h3>Improvements</h3><p>${esc(h.imp)}</p>`;return body}
function dl(h,kind){const d=new Date(h.start),nm=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+h.cheese;let body,type,ext;
 if(kind==='dat'){body=JSON.stringify(h,null,1);type='application/json';ext='json'}else{body=reportHtml(h);type='text/html';ext='html'}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=nm+'.'+ext;a.click()}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-lv]');if(!t)return;const a=t.dataset.lv;
 if(a==='logs')return showLogs(cur);if(a==='go')return startRun();if(a==='live'){pl(cur).noLive=false;return render()}if(a==='plan'){pl(cur).noLive=true;return render()}
 if(a==='rep'||a==='dat'){const h=hist(cur)[+t.dataset.h];return h&&dl(h,a)}
 if(!run)return;const k=lsched().cur,s=k>=0?run.st[k]:null,res=()=>{if(run.pausedAt){if(s)s.ext=(s.ext||0)+Date.now()-run.pausedAt;run.pausedAt=null}};
 if(a==='pause')run.pausedAt=Date.now();else if(a==='resume')res();else if(a==='ext'&&s){s.ext=(s.ext||0)+3e5;run.bn=''}
 else if(a==='done'&&s){res();s.done=Date.now();run.bn=''}else if(a==='undo'){const j=(k<0?run.st.length:k)-1;if(j>=0){run.st[j].done=null;run.warned={}}}
 else if(a==='cancel'){if(!confirm('Cancel this make? Readings so far will be lost.'))return;run=null;Store.del('run.json');return render()}
 else if(a==='save'){const f=run.fin||{},h={...run,finished:Date.now(),pausedAt:null,score:f.score||'',obs:f.obs||'',mist:f.mist||'',imp:f.imp||''};const mk=makeName(h);Store.put('makes/'+mk+'.json',h);Store.put('makes/'+mk+'.html',reportHtml(h));run=null;Store.del('run.json');return render()}
 svr();render()});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset&&t.dataset.lf;if(!f||!run)return;const s=run.st[+t.dataset.i];
 if(f==='temp')s.temp=t.value;else if(f==='ph')s.ph=t.value;else if(f==='meas')s.meas[t.dataset.mk]=t.value;else if(f==='sub')s.sub[+t.dataset.j]=t.checked;
 else if(f==='fin')run.fin[t.dataset.ff]=t.value;else if(f==='start'&&t.value)run.start=new Date(t.value).getTime();svr();if(f==='meas'||f==='start')render()});
let rr=0;setInterval(()=>{if(!run||run.pausedAt)return;const S=lsched(),k=S.cur;if(k<0)return;const x=S.rows[k],st=run.st[k],m=(x.m||0)*6e4,left=x.a+m+(st.ext||0)-Date.now(),cd=document.getElementById('cd');if(cd)cd.textContent=(left<0?'+':'')+clk(Math.abs(left));
 const w=run.warned,q=k+':'+(st.ext||0);if(m>0&&left<=0&&!w['e'+q]){w['e'+q]=1;alarm('Step '+x.n+': time is up',2)}else if(m>18e4&&left>0&&left<=12e4&&!w['w'+q]){w['w'+q]=1;alarm('Step '+x.n+' ends in 2 minutes',1)}
 if(++rr%30===0&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&run.cheese===cur&&!(P[cur]&&P[cur].noLive)&&!document.querySelector('details[open]'))render()},1000);
const hist=n=>Store.keys('makes/').filter(p=>p.endsWith('.json')).map(p=>Store.get(p)).filter(h=>h&&h.cheese===n).sort((a,b)=>b.start-a.start);
const fld=(l,v)=>v&&String(v).trim()?`<p class="nt"><b>${l}</b><br>${esc(v).replace(/\n/g,'<br>')}</p>`:'';
const sc10=v=>v!==''&&v!=null?' &middot; '+esc(v)+'/10':'';
function logEntries(n){const c=D[n]||{},L=hist(n).map(h=>({t:df(h.start),d:'',s:h.score,obs:h.obs,mist:h.mist,imp:h.imp}));(c.log||[]).forEach(l=>L.push({t:l.title||'',d:l.date||'',s:l.score,obs:l.obs,mist:l.mistakes,imp:l.imp}));return L}
function lessons(n){const L=logEntries(n).filter(e=>String(e.imp||'').trim()||String(e.mist||'').trim());if(!L.length)return'';
 return `<details class="box noprint"><summary><b>Lessons from earlier makes</b> <small>(${L.length} with improvements or mistakes noted)</small></summary>${L.map(e=>`<div class="nt"><b>${esc(e.t)}</b> ${esc(e.d)}${fld('Improvements',e.imp)}${fld('Mistakes',e.mist)}</div>`).join('<hr style="border:0;border-top:1px solid var(--line)">')}</details>`}
function showLogs(n){const L=logEntries(n),o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(16,36,61,.55);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px';o.id='logov';
 o.innerHTML=`<div style="background:#fff;max-width:760px;width:100%;max-height:90vh;overflow:auto;border-radius:8px;padding:14px"><h3 style="margin:0 0 4px">${esc(n)}: logs from earlier makes</h3><small>${L.length} make${L.length===1?'':'s'}, newest first</small>${L.length?L.map(e=>{const b=fld('Improvements',e.imp)+fld('Mistakes',e.mist)+fld('Observations',e.obs);return `<div class="box"><b>${esc(e.t)}</b> ${esc(e.d)}${sc10(e.s)}${b||'<p class="nt"><small>No notes recorded.</small></p>'}</div>`}).join(''):'<p>No makes logged yet.</p>'}<p><button class="b" id="lgc">Close</button></p></div>`;
 document.body.appendChild(o);o.onclick=ev=>{if(ev.target===o||ev.target.id==='lgc')o.remove()}}
const makeName=h=>{const d=new Date(h.start),b=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+h.cheese;let n=b,i=2;while(FS['makes/'+n+'.json'])n=b+' '+i++;return n};
function rebuild(){const o=Store.keys('recipes/').map(p=>Store.get(p)).filter(r=>r&&r.steps).sort((a,b)=>(a.ord??99)-(b.ord??99)||a.name.localeCompare(b.name));Object.keys(D).forEach(k=>delete D[k]);names.length=0;o.forEach(r=>{D[r.name]=r;names.push(r.name)});if(!D[cur])cur=names[0]||'';run=Store.get('run.json')||null;if(run)cur=run.cheese}
function renderEmpty(){$('#nav').innerHTML='';$('#app').innerHTML=stat==='loading'?'<h2>Loading from Drive\u2026</h2>':stat==='signin'?'<h2>Sign in to Google Drive</h2><div class="box"><p>Your recipes are in your Drive folder. Sign in to load them.</p><button class="b" id="si">Sign in with Google</button></div>':stat==='offline'?'<h2>Can\u2019t reach Drive</h2><div class="box"><p>There is no saved copy on this device yet. Check the connection and reload.</p></div>':'<h2>No recipes yet</h2><div class="box"><p>Your Drive folder has no recipes. Choose the starter file <b>cheese-seed.json</b> to add them.</p><input type="file" id="seedf" accept=".json"></div>';const s=document.getElementById('seedf');if(s)s.onchange=e=>e.target.files[0]&&importSeed(e.target.files[0])}
async function importSeed(file){try{const j=JSON.parse(await file.text());Object.keys(j).forEach((k,i)=>{const r=cl(j[k]);r.name=k;r.ord=i;r.schema=1;Store.put('recipes/'+k+'.json',r)});rebuild();render()}catch(e){alert('That file could not be read as a recipe file.')}}
async function syncNow(){const ch=await pull();if(ch)rebuild();if(run)wake();if(stat!=='signin'&&stat!=='offline')await flush();render()}
async function boot(){rebuild();render();setStat('loading');if(Drive.init)Drive.init();await syncNow()}
document.addEventListener('click',e=>{if((e.target.id==='sync'||e.target.id==='si')&&stat==='signin'&&Drive.signIn)Drive.signIn().then(syncNow).catch(()=>setStat('signin'));else if(e.target.id==='sync'||e.target.id==='dgb')showDiag();else if(e.target.id==='qb')quitApp()});
async function quitApp(){if(run&&!confirm('A make is in progress. It is saved and will resume when you open Cheese Book again. Quit now?'))return;const t0=Date.now();while((Q.length||busy)&&stat!=='signin'&&stat!=='offline'&&Date.now()-t0<8000){if(!busy)flush();await new Promise(r=>setTimeout(r,300))}if(Q.length&&!confirm(Q.length+' change(s) are not saved to Drive yet. They stay on this device and are sent next time. Quit anyway?'))return;window.close();setTimeout(()=>alert('The browser did not allow Quit to close this window. Close it with the X in the corner (on the tablet, swipe the app away).'),500)}
(function(){const m=document.querySelector('main'),b=document.getElementById('navb');const set=c=>{m.classList.toggle('nc',c);try{localStorage.setItem('cb:nav',c?'1':'0')}catch(e){}};let c=false;try{c=localStorage.getItem('cb:nav')==='1'}catch(e){}set(c);b.onclick=()=>set(!m.classList.contains('nc'))})();
addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&!Q.length&&await pull()){rebuild();if(!(P[cur]&&P[cur].draft))render()}});
setInterval(async()=>{if(Q.length)return flush();if(await pull()){rebuild();if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!(P[cur]&&P[cur].draft))render()}},60000);

boot();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
